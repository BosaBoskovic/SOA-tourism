<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Zaboravljena lozinka</h1>
      <p>Unesite korisničko ime ili email da biste zatražili reset lozinke.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!message">
      <div *ngIf="error" class="alert alert-error">{{ error }}</div>

      <div class="form-group">
        <label for="usernameOrEmail">Korisničko ime ili email</label>
        <input
          id="usernameOrEmail"
          type="text"
          class="form-control"
          formControlName="usernameOrEmail"
          [class.is-invalid]="submitted && f['usernameOrEmail']?.invalid"
        />
        <div *ngIf="submitted && f['usernameOrEmail']?.invalid" class="error-text">
          <small>Ovo polje je obavezno</small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Slanje...' : 'Pošalji zahtev' }}
      </button>
    </form>

    <div *ngIf="message">
      <div class="alert alert-success">{{ message }}</div>
      <div class="reset-token-box" *ngIf="resetToken">
        Nema email servisa u ovom demo okruženju - ovo je vaš reset kod:<br />
        <strong>{{ resetToken }}</strong>
      </div>
      <p class="auth-footer">
        <a [routerLink]="['/reset-password']" [queryParams]="{ token: resetToken }">Nastavi na reset lozinke →</a>
      </p>
    </div>

    <div class="auth-footer">
      <a routerLink="/login">← Nazad na prijavu</a>
    </div>
  </div>
</div>
