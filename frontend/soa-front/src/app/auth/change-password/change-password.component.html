<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Promena lozinke</h1>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div *ngIf="error" class="alert alert-error">{{ error }}</div>

      <div class="form-group">
        <label for="currentPassword">Trenutna lozinka</label>
        <input
          id="currentPassword"
          type="password"
          class="form-control"
          formControlName="currentPassword"
          [class.is-invalid]="submitted && f['currentPassword']?.invalid"
        />
        <div *ngIf="submitted && f['currentPassword']?.invalid" class="error-text">
          <small>Trenutna lozinka je obavezna</small>
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">Nova lozinka</label>
        <input
          id="newPassword"
          type="password"
          class="form-control"
          formControlName="newPassword"
          [class.is-invalid]="submitted && f['newPassword']?.invalid"
          placeholder="••••••••"
        />
        <div *ngIf="submitted && f['newPassword']?.invalid" class="error-text">
          <small *ngIf="f['newPassword']?.hasError('required')">Nova lozinka je obavezna</small>
          <small *ngIf="f['newPassword']?.hasError('minlength')">Lozinka mora imati najmanje 8 karaktera</small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Čuvanje...' : 'Promeni lozinku' }}
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/profile">← Nazad na profil</a>
    </div>
  </div>
</div>
