<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h1>Reset lozinke</h1>
    </div>

    <div *ngIf="success" class="alert alert-success">
      Lozinka je promenjena! Preusmeravanje na prijavu...
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" *ngIf="!success">
      <div *ngIf="error" class="alert alert-error">{{ error }}</div>

      <div class="form-group">
        <label for="token">Reset kod</label>
        <input
          id="token"
          type="text"
          class="form-control"
          formControlName="token"
          [class.is-invalid]="submitted && f['token']?.invalid"
        />
        <div *ngIf="submitted && f['token']?.invalid" class="error-text">
          <small>Reset kod je obavezan</small>
        </div>
      </div>

      <div class="form-group">
        <label for="newPassword">Nova lozinka</label>
        <input
          id="newPassword"
          type="password"
          class="form-control"
          formControlName="newPassword"
          [class.is-invalid]="submitted && f['newPassword']?.invalid"
          placeholder="••••••••"
        />
        <div *ngIf="submitted && f['newPassword']?.invalid" class="error-text">
          <small *ngIf="f['newPassword']?.hasError('required')">Nova lozinka je obavezna</small>
          <small *ngIf="f['newPassword']?.hasError('minlength')">Lozinka mora imati najmanje 8 karaktera</small>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="loading">
        {{ loading ? 'Čuvanje...' : 'Postavi novu lozinku' }}
      </button>
    </form>

    <div class="auth-footer">
      <a routerLink="/login">← Nazad na prijavu</a>
    </div>
  </div>
</div>
