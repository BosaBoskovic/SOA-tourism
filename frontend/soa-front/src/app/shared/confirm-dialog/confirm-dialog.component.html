<div class="confirm-backdrop" *ngIf="active" (click)="respond(false)">
  <div class="confirm-box" (click)="$event.stopPropagation()">
    <p>{{ active.message }}</p>
    <div class="confirm-actions">
      <button type="button" class="btn-cancel" (click)="respond(false)">{{ active.cancelLabel }}</button>
      <button type="button" class="btn-confirm" (click)="respond(true)">{{ active.confirmLabel }}</button>
    </div>
  </div>
</div>
