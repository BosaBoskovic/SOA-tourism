<div class="admin-card">
  <h2>Administracija korisnika</h2>

  <app-spinner *ngIf="loading && accounts.length === 0" label="Učitavanje naloga..."></app-spinner>
  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>

  <input
    *ngIf="accounts.length > 0"
    class="search-input"
    type="text"
    placeholder="Pretraga po korisničkom imenu ili e-mailu..."
    [(ngModel)]="searchTerm"
    (ngModelChange)="onSearchChange()"
  />

  <table *ngIf="pagedAccounts.length > 0" class="accounts-table">
    <thead>
      <tr>
        <th>Korisničko ime</th>
        <th>Email</th>
        <th>Uloga</th>
        <th>Status</th>
        <th>Akcija</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let account of pagedAccounts">
        <td>{{ account.username }}</td>
        <td>{{ account.email }}</td>
        <td>{{ account.role }}</td>
        <td>
          <span [class.blocked]="account.isBlocked" [class.active]="!account.isBlocked">
            {{ account.isBlocked ? 'Blokiran' : 'Aktivan' }}
          </span>
        </td>
        <td class="actions-cell">
          <button
            class="btn-block"
            *ngIf="!account.isBlocked"
            [disabled]="account.role?.toLowerCase() === 'admin'"
            (click)="blockAccount(account)"
          >
            Blokiraj
          </button>
          <button
            class="btn-unblock"
            *ngIf="account.isBlocked"
            (click)="unblockAccount(account)"
          >
            Odblokiraj
          </button>
          <button
            class="btn-delete"
            [disabled]="account.role?.toLowerCase() === 'admin'"
            (click)="deleteAccount(account)"
          >
            Obriši
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="pagination" *ngIf="filteredAccounts.length > pageSize">
    <button class="btn-page" (click)="goToPage(page - 1)" [disabled]="page === 0">← Prethodna</button>
    <span class="page-info">Strana {{ page + 1 }} od {{ totalPages }} ({{ filteredAccounts.length }} naloga)</span>
    <button class="btn-page" (click)="goToPage(page + 1)" [disabled]="page + 1 >= totalPages">Sljedeća →</button>
  </div>

  <app-empty-state
    *ngIf="!loading && accounts.length === 0"
    icon="👥"
    title="Nema naloga"
    message="Nema naloga za prikaz."
  ></app-empty-state>
  <app-empty-state
    *ngIf="!loading && accounts.length > 0 && filteredAccounts.length === 0"
    icon="🔍"
    title="Nema rezultata"
    message="Nema naloga koji odgovaraju pretrazi."
  ></app-empty-state>
</div>
