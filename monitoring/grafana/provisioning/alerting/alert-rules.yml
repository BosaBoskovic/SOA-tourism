apiVersion: 1

# Grafana Alert Rules — SOA Tourism
# Automatski se učitavaju kroz provisioning
# Prikazuju se u Grafana UI pod Alerting > Alert Rules

groups:
  - orgId: 1
    name: "Host Machine Alerts"
    folder: "SOA Tourism"
    interval: 1m
    rules:
      - uid: alert-cpu-high
        title: "⚠ Visoka iskorišćenost CPU-a (> 85%)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "CPU iskorišćenost je iznad 85% već 2 minuta"
          description: "Host mašina je pod visokim opterećenjem. Provjeri procese."
        labels:
          severity: warning
          team: soa-tourism

      - uid: alert-ram-high
        title: "⚠ Visoka iskorišćenost RAM-a (> 90%)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "(1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 2m
        annotations:
          summary: "RAM iskorišćenost je iznad 90% već 2 minuta"
          description: "Sistem je blizu limita memorije. Moguć OOM killer."
        labels:
          severity: critical
          team: soa-tourism

      - uid: alert-disk-full
        title: "🔴 Disk skoro pun (> 85%)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "100 - ((node_filesystem_avail_bytes{fstype!~\"tmpfs|fuse.lxcfs|squashfs\",mountpoint=\"/\"} / node_filesystem_size_bytes{fstype!~\"tmpfs|fuse.lxcfs|squashfs\",mountpoint=\"/\"}) * 100)"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Disk / je popunjen više od 85%"
          description: "Potrebno čišćenje disk prostora ili proširivanje particije."
        labels:
          severity: warning
          team: soa-tourism

  - orgId: 1
    name: "Application Alerts"
    folder: "SOA Tourism"
    interval: 1m
    rules:
      - uid: alert-service-down
        title: "🔴 Servis nedostupan Prometheus-u"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              # count(...) alone still wasn't enough: PromQL aggregations
              # over zero matching series produce zero RESULT series, not a
              # reduced "0" - there's nothing to aggregate when nothing is
              # down, so count() came back empty too, still tripping "only
              # reduced data can be alerted on". `OR vector(0)` is the
              # standard PromQL fallback idiom for exactly this: use the
              # left side if it has any results, otherwise fall back to a
              # single 0 - guaranteeing exactly one series either way.
              expr: "count(up{job=\"services\"} == 0) OR vector(0)"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Error
        for: 1m
        annotations:
          summary: "Prometheus ne uspijeva da skrejpuje {{ $labels.service }}"
          description: "Instanca {{ $labels.instance }} ({{ $labels.service }}) je down duže od 1 minuta. Ili je kontejner pao ili /metrics ne odgovara."
        labels:
          severity: critical
          team: soa-tourism

      - uid: alert-high-error-rate
        title: "⚠ Visoka stopa 5xx grešaka po servisu (> 5%)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "sum by (service) (rate(http_requests_total{status=~\"5..\"}[5m])) / sum by (service) (rate(http_requests_total[5m])) * 100"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 5
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          summary: "{{ $labels.service }} vraća preko 5% 5xx odgovora"
          description: "Stopa 5xx grešaka za {{ $labels.service }} je iznad 5% u poslednjih 5 minuta."
        labels:
          severity: critical
          team: soa-tourism

      - uid: alert-high-latency
        title: "⚠ Visoka p95 latencija po servisu (> 1s)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "histogram_quantile(0.95, sum by (service, le) (rate(http_request_duration_seconds_bucket[5m])))"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $labels.service }} ima p95 latenciju iznad 1s"
          description: "95-ti percentil trajanja zahtjeva za {{ $labels.service }} je preko 1 sekunde u poslednjih 5 minuta."
        labels:
          severity: warning
          team: soa-tourism

      - uid: alert-rabbitmq-queue-backlog
        title: "⚠ RabbitMQ red poruka se gomila (> 500 spremnih poruka)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "sum(rabbitmq_queue_messages_ready)"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 500
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "RabbitMQ ima veliki broj neobrađenih poruka"
          description: "Konzumenti (tours/payments) ne stižu da obrade poruke iz reda — provjeri da li su servisi živi."
        labels:
          severity: warning
          team: soa-tourism

      # alert-rabbitmq-queue-backlog above sums ALL queues together, so a
      # handful of permanently-failed notifications would be invisible
      # next to a healthy notification-delivery backlog on a busy day -
      # this rule watches the dead-letter queue specifically.
      - uid: alert-notification-delivery-dead
        title: "🔴 Notifikacije trajno neisporučene (dead-letter red > 0)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "sum(rabbitmq_queue_messages_ready{queue=\"notification-delivery-dead\"})"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "Postoje notifikacije koje su trajno neisporučene"
          description: "notification-delivery-dead red nije prazan — provjeri stakeholders logove/Jaeger za uzrok (trace_id je u notification_dead_lettered log liniji)."
        labels:
          severity: warning
          team: soa-tourism

  # Resource & Scaling Alerts — prate deploy.resources.limits iz
  # docker-compose.yml (Faza 1) preko cAdvisor metrika, agregatno po
  # servisu (zbir svih repliki), tako da rade i pre i posle skaliranja.
  - orgId: 1
    name: "Resource & Scaling Alerts"
    folder: "SOA Tourism"
    interval: 1m
    rules:
      - uid: alert-service-mem-high
        title: "⚠ Servis koristi > 75% memorijskog limita"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "sum by (container_label_com_docker_compose_service) (container_memory_usage_bytes{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"}) / sum by (container_label_com_docker_compose_service) (container_spec_memory_limit_bytes{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"}) * 100"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 75
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} koristi preko 75% dodijeljene memorije"
          description: "Servis se približava mem limitu iz docker-compose.yml (deploy.resources.limits.memory). Razmisli o 'docker compose up -d --scale <servis>=N' ili provjeri curenje memorije."
        labels:
          severity: warning
          team: soa-tourism

      - uid: alert-service-mem-critical
        title: "🔴 Servis koristi > 90% memorijskog limita (rizik od OOM-kill)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "sum by (container_label_com_docker_compose_service) (container_memory_usage_bytes{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"}) / sum by (container_label_com_docker_compose_service) (container_spec_memory_limit_bytes{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"}) * 100"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} je na ivici svog memorijskog limita"
          description: "Preko 90% mem limita — kernel OOM-killer može ugasiti kontejner u svakom trenutku. Provjeri i OOM-kill panel na Container Metrics dashboardu."
        labels:
          severity: critical
          team: soa-tourism

      - uid: alert-service-cpu-high
        title: "⚠ Servis koristi > 75% CPU limita"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "sum by (container_label_com_docker_compose_service) (rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"}[2m])) / sum by (container_label_com_docker_compose_service) (container_spec_cpu_quota{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"} / container_spec_cpu_period{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"}) * 100"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 75
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} koristi preko 75% dodijeljenog CPU-a"
          description: "Servis se približava cpus limitu iz docker-compose.yml (deploy.resources.limits.cpus). Razmisli o skaliranju."
        labels:
          severity: warning
          team: soa-tourism

      - uid: alert-service-cpu-critical
        title: "🔴 Servis koristi > 90% CPU limita"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "sum by (container_label_com_docker_compose_service) (rate(container_cpu_usage_seconds_total{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"}[2m])) / sum by (container_label_com_docker_compose_service) (container_spec_cpu_quota{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"} / container_spec_cpu_period{container_label_com_docker_compose_project=\"soa-tourism\",container_label_com_docker_compose_service=~\"gateway|stakeholders|blog|followers|tours|encounters|payments\"}) * 100"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} je CPU-throttlovan"
          description: "Preko 90% cpus limita — kernel CFS scheduler aktivno throttluje kontejner (vidljivo i kao rastuća latencija na Services Overview dashboardu)."
        labels:
          severity: critical
          team: soa-tourism

      - uid: alert-oom-kill
        title: "🔴 OOM-kill: kernel je ugasio kontejner zbog memorije"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "sum by (container_label_com_docker_compose_service) (increase(container_oom_events_total{container_label_com_docker_compose_project=\"soa-tourism\"}[5m]))"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "{{ $labels.container_label_com_docker_compose_service }} je OOM-killovan"
          description: "Kernel je ugasio kontejner jer je prešao svoj memorijski limit. Servis će se restartovati (restart: on-failure) ali je obradio 0 zahtjeva u međuvremenu — dobar signal za load testiranje."
        labels:
          severity: critical
          team: soa-tourism

      - uid: alert-service-flapping
        title: "⚠ Servis se stalno restartuje (flapping)"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "PBFA97CFB590B2093"
            model:
              expr: "changes(up{job=\"services\"}[5m])"
              intervalMs: 1000
              maxDataPoints: 43200
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: "-100"
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - A
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: "__expr__"
                uid: "-100"
              expression: A
              refId: C
              type: threshold
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations:
          summary: "{{ $labels.service }} je promijenio up/down status vise od 2 puta u 5 minuta"
          description: "Servis flappuje - crash-restart petlja. Provjeri logove (Loki dashboard, izaberi $service) i Jaeger za poslednje zahtjeve prije pada."
        labels:
          severity: warning
          team: soa-tourism
