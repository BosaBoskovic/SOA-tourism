server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker service discovery instead of a static file glob: this gives us a
  # real "service" label without every service having to agree on a log
  # field for it. Derived from the com.docker.compose.service container
  # label (not the container name) so it stays correct once a service runs
  # as multiple replicas without a fixed container_name (docker-compose.yml)
  # - every replica still labels as the same "service" value.
  - job_name: docker-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: container

    pipeline_stages:
      # Unwrap the Docker JSON-file log envelope ({"log":"...","stream":"...","time":"..."}).
      - docker: {}

      # Our services log one JSON object per line (see each service's
      # logging setup). Services that still log plain text (or a line that
      # isn't JSON) simply fall through with no extra labels/metadata below,
      # they're still stored and searchable by line content.
      #
      # Go/Node/Java put trace_id/span_id as flat top-level fields.
      # payments (.NET) uses the framework's own ActivityTrackingOptions
      # instead, which the JSON console formatter nests as
      # Scopes: [{"TraceId": "...", "SpanId": "...", "ParentId": "..."}]
      # rather than top-level - pull both shapes out here so every service
      # ends up with the same flat trace_id/span_id, instead of only fixing
      # it in payments' own logging setup (keeps that code idiomatic .NET).
      - json:
          expressions:
            level: level
            trace_id_flat: trace_id
            span_id_flat: span_id
            trace_id_scoped: "Scopes[?TraceId] | [0].TraceId"
            span_id_scoped: "Scopes[?SpanId] | [0].SpanId"

      - template:
          source: trace_id
          template: '{{ if .trace_id_flat }}{{ .trace_id_flat }}{{ else }}{{ .trace_id_scoped }}{{ end }}'

      - template:
          source: span_id
          template: '{{ if .span_id_flat }}{{ .span_id_flat }}{{ else }}{{ .span_id_scoped }}{{ end }}'

      # level is low-cardinality (debug/info/warn/error) -> safe as an
      # indexed label, so you can filter with e.g. {service="tours-service", level="error"}.
      - labels:
          level:

      # trace_id/span_id are effectively unique per request -> stored as
      # structured metadata (Loki 2.9+), not labels, so they don't blow up
      # the index. Lets you jump from a log line straight to its Jaeger trace.
      - structured_metadata:
          trace_id:
          span_id:
