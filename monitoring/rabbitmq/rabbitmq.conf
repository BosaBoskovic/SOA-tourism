# Per-queue (per-object) Prometheus metrics, off by default. Without this,
# rabbitmq_queue_* series carry no "queue" label at all - just one
# cluster-wide aggregate number - which silently breaks any alert/panel
# that filters by queue (e.g. the notification-delivery-dead depth alert
# and the new Messaging dashboard). Cheap to enable at this queue count.
prometheus.return_per_object_metrics = true
