# Network lockdown: stakeholders/blog/followers/tours/payments/encounters no
# longer publish a host port. The gateway (8080) is the only app entry point
# from outside docker; every other service is reachable only from other
# containers on soa-network. Databases, RabbitMQ's management UI, and the
# monitoring stack still publish their ports for local debugging.
services:
  neo4j:
    image: neo4j:5
    container_name: soa-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4JLABS_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"  # Neo4j Browser
      - "7687:7687"  # Bolt protokol
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_import:/var/lib/neo4j/import
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "password", "RETURN 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - soa-network

  stakeholders:
    build:
      context: .
      dockerfile: services/stakeholders/Dockerfile
    # No fixed container_name: scalable via "docker compose up -d --scale
    # stakeholders=N" (Docker's embedded DNS then round-robins the plain
    # "stakeholders" hostname across every healthy replica - see the
    # gateway's dns:/// gRPC targets and every caller's STAKEHOLDERS_URL
    # below).
    # No host port published: only the gateway and other containers on
    # soa-network can reach this service now (see docker-compose network
    # lockdown notes at the bottom of this file).
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env}
      RABBITMQ_HOST: rabbitmq
      OTEL_SERVICE_NAME: stakeholders-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://soa-jaeger:4318
    depends_on:
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - soa-network

  mongodb-blog:
    image: mongo:7
    container_name: soa-mongodb-blog
    ports:
      - "27017:27017"
    volumes:
      - mongodb_blog_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soa-network

  mongodb-blog-exporter:
    image: percona/mongodb_exporter:0.44
    container_name: soa-mongodb-blog-exporter
    command:
      - "--mongodb.uri=mongodb://soa-mongodb-blog:27017"
    depends_on:
      mongodb-blog:
        condition: service_healthy
    networks:
      - soa-network

  mongo-express:
    image: mongo-express
    container_name: soa-mongo-express
    ports:
      - "8083:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: soa-mongodb-blog
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongodb-blog
    networks:
      - soa-network

  blog:
    build:
      context: ./services/blog
      dockerfile: Dockerfile
    # No fixed container_name: scalable via --scale blog=N (see stakeholders above).
    # No host port published - gateway-only (see network lockdown notes below).
    environment:
      MONGODB_URI: mongodb://soa-mongodb-blog:27017/blogdb
      MONGODB_DATABASE: blogdb
      FOLLOWER_SERVICE_URL: http://followers:8084
      STAKEHOLDERS_URL: http://stakeholders:8081
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env}
      OTEL_SERVICE_NAME: blog-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://soa-jaeger:4318
      # Container-aware JVM heap: cap at 75% of the 512M deploy.resources
      # limit below instead of a fixed -Xmx, so the JVM leaves headroom for
      # metaspace/threads/off-heap and the OS never has to OOM-kill it first.
      JDK_JAVA_OPTIONS: "-XX:MaxRAMPercentage=75.0"
    depends_on:
      followers:
        condition: service_healthy
      mongodb-blog:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - soa-network

  followers:
    build:
      context: ./services/followers
      dockerfile: Dockerfile
    # No fixed container_name: scalable via --scale followers=N (see stakeholders above).
    # No host port published - gateway-only (see network lockdown notes below).
    environment:
      PORT: 8084
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      NEO4J_DATABASE: neo4j
      STAKEHOLDERS_URL: http://stakeholders:8081
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env}
      OTEL_SERVICE_NAME: followers-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://soa-jaeger:4318
    depends_on:
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8084/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - soa-network

  mongodb-tours:
    image: mongo:7
    container_name: soa-mongodb-tours
    ports:
      - "27018:27017"         
    volumes:
      - mongodb_tours_data:/data/db
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - soa-network

  mongodb-tours-exporter:
    image: percona/mongodb_exporter:0.44
    container_name: soa-mongodb-tours-exporter
    command:
      - "--mongodb.uri=mongodb://soa-mongodb-tours:27017"
    depends_on:
      mongodb-tours:
        condition: service_healthy
    networks:
      - soa-network

  tours:
    build:
      context: .
      dockerfile: services/tours/Dockerfile
    # No fixed container_name: scalable via --scale tours=N (see stakeholders above).
    # No host port published - gateway-only (see network lockdown notes below).
    environment:
      MONGODB_URI: soa-mongodb-tours:27017
      PORT: 8085
      TOURS_GRPC_PORT: 9093
      PAYMENTS_URL: http://payments:8086
      STAKEHOLDERS_URL: http://stakeholders:8081
      RABBITMQ_HOST: rabbitmq
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env}
      OTEL_SERVICE_NAME: tours-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://soa-jaeger:4318
    depends_on:
      mongodb-tours:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - soa-network

  # ENCOUNTERS - proximity-based izazovi (tura/keypoint opcioni), svoja
  # "encountersDB" baza na istom Mongo serveru koji koristi tours
  encounters:
    build:
      context: .
      dockerfile: services/encounters/Dockerfile
    # No fixed container_name: scalable via --scale encounters=N (see stakeholders above).
    # No host port published - gateway-only (see network lockdown notes below).
    environment:
      PORT: 8083
      MONGODB_URI: soa-mongodb-tours:27017
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env}
      OTEL_SERVICE_NAME: encounters-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://soa-jaeger:4318
    depends_on:
      mongodb-tours:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - soa-network

  # API GATEWAY - jedina ulazna tačka za sve klijente
  # Svi zahtjevi idu na :8080, gateway rutira dalje
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: soa-gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      # Bare compose service names (not soa-<service>) for the 6 scalable
      # backend services below: Docker's embedded DNS resolves these to
      # every healthy replica, which is what makes --scale <service>=N
      # actually spread traffic (round-robin gRPC via dns:/// targets in
      # main.go, tuned-keepalive HTTP reverse proxies). gateway itself and
      # every infra container keep their fixed soa-* name since they stay
      # single-instance.
      STAKEHOLDERS_URL: http://stakeholders:8081
      STAKEHOLDERS_GRPC_URL: stakeholders:9091
      BLOG_URL: http://blog:8082
      FOLLOWERS_URL: http://followers:8084
      ENCOUNTERS_URL: http://encounters:8083
      TOURS_URL: http://tours:8085
      TOURS_GRPC_URL: tours:9093
      PAYMENTS_URL: http://payments:8086
      PAYMENTS_GRPC_URL: payments:9092
      BLOGS_GRPC_URL: blog:9095
      ALLOWED_ORIGINS: http://localhost:4200
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env}
      UPLOADS_DIR: /data/uploads
      OTEL_SERVICE_NAME: gateway
      OTEL_EXPORTER_OTLP_ENDPOINT: http://soa-jaeger:4318
    volumes:
      - gateway_uploads:/data/uploads
    depends_on:
      stakeholders:
        condition: service_healthy
      blog:
        condition: service_healthy
      followers:
        condition: service_healthy
      tours:
        condition: service_healthy
      payments:
        condition: service_healthy
      encounters:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - soa-network


  postgres-payments:
    image: postgres:16
    container_name: soa-postgres-payments
    environment:
      POSTGRES_DB: paymentsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_payments_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d paymentsdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - soa-network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: soa-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:postgres@postgres-payments:5432/paymentsdb?sslmode=disable"
    depends_on:
      postgres-payments:
        condition: service_healthy
    networks:
      - soa-network

  payments:
    build:
      context: ./services/payments
      dockerfile: Dockerfile
    # No fixed container_name: scalable via --scale payments=N (see stakeholders above).
    # No host port published - gateway-only (see network lockdown notes below).
    environment:
      ASPNETCORE_URLS: http://+:8086;http://+:9092
      PAYMENTS_GRPC_PORT: 9092
      TOURS_URL: http://tours:8085
      RABBITMQ_HOST: rabbitmq
      ConnectionStrings__DefaultConnection: "Host=soa-postgres-payments;Port=5432;Database=paymentsdb;Username=postgres;Password=postgres"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set - copy .env.example to .env}
      OTEL_SERVICE_NAME: payments-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://soa-jaeger:4318
    depends_on:
      postgres-payments:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.75"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - soa-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: soa-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692" # rabbitmq_prometheus plugin, scraped u prometheus.yml
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - ./monitoring/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./monitoring/rabbitmq/rabbitmq.conf:/etc/rabbitmq/conf.d/10-prometheus.conf:ro
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    networks:
      - soa-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: soa-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - soa-network

  prometheus:
    image: prom/prometheus:latest
    container_name: soa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - soa-network

  grafana:
      image: grafana/grafana:latest
      container_name: soa-grafana
      ports:
        - "3001:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
        # Provisioning putanje
        GF_PATHS_PROVISIONING: /etc/grafana/provisioning
        # Omogući alerting
        GF_ALERTING_ENABLED: "true"
        GF_UNIFIED_ALERTING_ENABLED: "true"
        # Jaeger plugin (tracing)
        #GF_INSTALL_PLUGINS: grafana-jaeger-datasource
      volumes:
        - grafana_data:/var/lib/grafana
        # Datasources provisioning (Prometheus + Loki + Jaeger)
        - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
        # Dashboards provisioning config
        - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
        # Alerting rules provisioning
        - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting
      depends_on:
        - prometheus
        - loki
        - jaeger
      networks:
        - soa-network

  loki:
      image: grafana/loki:latest
      container_name: soa-loki
      ports:
        - "3100:3100"
      command: -config.file=/etc/loki/loki-config.yml
      volumes:
        - ./monitoring/loki-config.yml:/etc/loki/loki-config.yml
        - loki_data:/loki
      networks:
        - soa-network

  promtail:
      image: grafana/promtail:latest
      container_name: soa-promtail
      command: -config.file=/etc/promtail/promtail-config.yml
      volumes:
        - ./monitoring/promtail-config.yml:/etc/promtail/promtail-config.yml
        - /var/lib/docker/containers:/var/lib/docker/containers:ro
        - /var/run/docker.sock:/var/run/docker.sock:ro
        - /var/log:/var/log:ro
        - promtail_positions:/tmp
      depends_on:
        - loki
      networks:
        - soa-network

  node-exporter:
      image: prom/node-exporter:latest
      container_name: soa-node-exporter
      ports:
        - "9100:9100"
      volumes:
        - /proc:/host/proc:ro
        - /sys:/host/sys:ro
        - /:/rootfs:ro
      command:
        - '--path.procfs=/host/proc'
        - '--path.sysfs=/host/sys'
        - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      networks:
        - soa-network

  cadvisor:
      image: gcr.io/cadvisor/cadvisor:latest
      container_name: soa-cadvisor
      ports:
        - "8089:8080"
      volumes:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
        - /dev/disk/:/dev/disk:ro
      privileged: true
      devices:
        - /dev/kmsg
      networks:
        - soa-network

volumes:
  neo4j_data:
  neo4j_import:
  mongodb_blog_data:
  mongodb_tours_data:
  postgres_payments_data:
  prometheus_data:
  grafana_data:
  loki_data:
  promtail_positions:
  gateway_uploads:

networks:
  soa-network:
    driver: bridge