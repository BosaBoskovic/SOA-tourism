server.port=8082

grpc.server.port=9095

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/blogdb}
spring.data.mongodb.database=${MONGODB_DATABASE:blogdb}
follower.service.url=${FOLLOWER_SERVICE_URL:http://localhost:8084}

# --- Monitoring -------------------------------------------------------
# Expose /health and /metrics at the root, same convention as every other service.
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=always
management.endpoints.web.path-mapping.prometheus=metrics
management.health.mongo.enabled=true

# Distributed tracing: export every span to Jaeger via OTLP (same collector the Go services use).
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
spring.application.name=${OTEL_SERVICE_NAME:blog-service}

# Structured JSON logs carry traceId/spanId automatically once tracing is enabled (see logback-spring.xml).
logging.pattern.level=%5p [%X{traceId:-},%X{spanId:-}]